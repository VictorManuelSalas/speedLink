<div #root class="picklist" [class.open]="open()" [class.disabled]="disabled()">
  <button
    class="trigger"
    type="button"
    [disabled]="disabled()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    (click)="toggle($event)"
    (keydown.arrowDown)="openMenu($event)"
    (keydown.escape)="close()"
  >
    <span [class.placeholder]="!selected()">{{ selected()?.label || placeholder() }}</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
  </button>
  @if (open()) {
    <div
      class="menu"
      role="listbox"
      [appFloatingPanel]="root"
      [matchWidth]="true"
      (click)="$event.stopPropagation()"
    >
      @if (showSearch()) {
        <label class="search"
          ><svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" /></svg
          ><input
            #searchInput
            type="search"
            placeholder="Buscar…"
            (input)="query.set(searchInput.value)"
        /></label>
      }
      <div class="options">
        @for (option of filtered(); track option.value) {
          <button
            type="button"
            role="option"
            [class.selected]="option.value === value()"
            [attr.aria-selected]="option.value === value()"
            (click)="choose(option.value)"
          >
            <span
              ><b>{{ option.label }}</b>
              @if (option.detail) {
                <small>{{ option.detail }}</small>
              }
            </span>
            @if (option.value === value()) {
              <i>✓</i>
            }
          </button>
        } @empty {
          <p>Sin resultados</p>
        }
      </div>
    </div>
  }
</div>
