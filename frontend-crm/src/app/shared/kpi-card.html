<article class="card kpi">
  <div class="kpi__top">
    <span class="kpi__icon kpi__icon--{{ tone() }}"><img [src]="icon()" alt="" /></span
    >@if (trend()) {<span class="trend">{{ trend() }}</span>}
  </div>
  <p>{{ label() }}</p>
  <strong>
    @if (currency()) {
      {{ value() | currency: 'MXN' : 'symbol-narrow' : '1.0-0' : i18n.locale() }}
    } @else {
      {{ value() | number: '1.0-0' : i18n.locale() }}
    }</strong
  ><small>{{ note() }}</small>
</article>
